name: Build Windows Exe

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Full jpackage build + GitHub Release on version tags; artifact-only on manual dispatch.
  release:
    name: Build & Release
    runs-on: windows-2025
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Read version from pom.xml so jpackage and the release tag stay in sync.
      - name: Extract version
        id: version
        run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT
        shell: bash

      # Produces target/cardmarket-shipping.jar (fat JAR with embedded Tomcat).
      # build-info goal runs automatically and embeds the version into the JAR.
      - name: Build fat JAR
        run: mvn package -DskipTests
        shell: bash

      # Bundles the JAR + a self-contained JRE into a Windows app image.
      # No Java installation is required on the target PC.
      - name: Package with jpackage
        run: |
          jpackage \
            --input target \
            --main-jar cardmarket-shipping.jar \
            --name CardmarketShipping \
            --app-version ${{ steps.version.outputs.VERSION }} \
            --type app-image \
            --java-options "-Dfile.encoding=UTF-8" \
            --win-console \
            --dest dist
        shell: bash

      # Zip the entire app folder so it can be downloaded as a single file.
      - name: Zip app image
        run: Compress-Archive -Path dist\CardmarketShipping -DestinationPath CardmarketShipping-windows.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: CardmarketShipping-windows
          path: CardmarketShipping-windows.zip
          retention-days: 30

      # Only publish a GitHub Release when triggered by a version tag (e.g. v1.0.1).
      # Manual workflow_dispatch runs upload the artifact above but do not create a release.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CardmarketShipping-windows.zip
